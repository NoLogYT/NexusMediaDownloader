version: '3.8'

services:
  # Next.js Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8000
    depends_on:
      - api
    networks:
      - nexus-network

  # FastAPI Backend
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    volumes:
      - ./downloads:/app/downloads
    environment:
      - DOWNLOAD_DIR=/app/downloads
    networks:
      - nexus-network

  # PostgreSQL Database (Optional - for persistent storage)
  # postgres:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_USER: nexus
  #     POSTGRES_PASSWORD: nexus_password
  #     POSTGRES_DB: nexus_db
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   networks:
  #     - nexus-network

  # Redis (Optional - for job queue)
  # redis:
  #   image: redis:7-alpine
  #   ports:
  #     - "6379:6379"
  #   networks:
  #     - nexus-network

networks:
  nexus-network:
    driver: bridge

volumes:
  postgres_data:
